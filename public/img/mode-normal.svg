<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#1b2d52"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223a"/>
      <stop offset="1" stop-color="#101829"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07263a"/>
      <stop offset="1" stop-color="#041624"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect width="800" height="500" fill="url(#wall)"/>

  <!-- window with city -->
  <rect x="470" y="40" width="290" height="210" rx="6" fill="url(#sky)" stroke="#2b3b5e" stroke-width="6"/>
  <line x1="615" y1="40" x2="615" y2="250" stroke="#2b3b5e" stroke-width="5"/>
  <circle cx="700" cy="85" r="18" fill="#e2e8f0" opacity="0.85"/>
  <circle cx="707" cy="80" r="16" fill="#0f2142"/>
  <g fill="#0d1830">
    <rect x="476" y="170" width="40" height="77"/>
    <rect x="520" y="140" width="34" height="107"/>
    <rect x="558" y="185" width="50" height="62"/>
    <rect x="620" y="150" width="38" height="97"/>
    <rect x="662" y="120" width="30" height="127"/>
    <rect x="696" y="175" width="60" height="72"/>
  </g>
  <g fill="#fbbf24" opacity="0.8">
    <rect x="484" y="182" width="6" height="6"/><rect x="500" y="200" width="6" height="6"/>
    <rect x="528" y="152" width="6" height="6"/><rect x="540" y="176" width="6" height="6"/>
    <rect x="568" y="196" width="6" height="6"/><rect x="590" y="214" width="6" height="6"/>
    <rect x="630" y="166" width="6" height="6"/><rect x="644" y="190" width="6" height="6"/>
    <rect x="670" y="136" width="6" height="6"/><rect x="678" y="170" width="6" height="6"/>
    <rect x="708" y="190" width="6" height="6"/><rect x="734" y="210" width="6" height="6"/>
  </g>

  <!-- wall clock -->
  <circle cx="110" cy="95" r="42" fill="#0f172a" stroke="#334155" stroke-width="6"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="60" x2="110" y2="66"/><line x1="110" y1="124" x2="110" y2="130"/>
    <line x1="75" y1="95" x2="81" y2="95"/><line x1="139" y1="95" x2="145" y2="95"/>
  </g>
  <line x1="110" y1="95" x2="110" y2="70" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="95" x2="128" y2="104" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <circle cx="110" cy="95" r="4" fill="#e2e8f0"/>

  <!-- ceiling lamp glow -->
  <rect x="210" y="0" width="160" height="10" rx="3" fill="#e2e8f0" opacity="0.7"/>
  <ellipse cx="290" cy="10" rx="200" ry="220" fill="url(#lamp)"/>

  <!-- screen glow -->
  <ellipse cx="300" cy="270" rx="260" ry="170" fill="url(#glow)"/>

  <!-- desk -->
  <rect x="0" y="380" width="800" height="120" fill="#0b1120"/>
  <rect x="0" y="372" width="800" height="14" fill="#1e293b"/>

  <!-- monitor -->
  <rect x="150" y="150" width="300" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="6"/>
  <rect x="164" y="164" width="272" height="162" rx="4" fill="url(#screen)"/>
  <g stroke-linecap="round" stroke-width="7">
    <line x1="182" y1="186" x2="232" y2="186" stroke="#f472b6"/>
    <line x1="242" y1="186" x2="320" y2="186" stroke="#22d3ee"/>
    <line x1="200" y1="208" x2="270" y2="208" stroke="#a78bfa"/>
    <line x1="280" y1="208" x2="350" y2="208" stroke="#4ade80"/>
    <line x1="200" y1="230" x2="250" y2="230" stroke="#22d3ee"/>
    <line x1="260" y1="230" x2="400" y2="230" stroke="#e2e8f0" opacity="0.6"/>
    <line x1="218" y1="252" x2="300" y2="252" stroke="#fbbf24"/>
    <line x1="200" y1="274" x2="240" y2="274" stroke="#a78bfa"/>
    <line x1="182" y1="296" x2="214" y2="296" stroke="#f472b6"/>
  </g>
  <rect x="222" y="289" width="10" height="16" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="285" y="340" width="30" height="26" fill="#1e293b"/>
  <rect x="245" y="362" width="110" height="12" rx="4" fill="#334155"/>

  <!-- keyboard -->
  <rect x="200" y="392" width="200" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="3"/>

  <!-- coffee mug -->
  <rect x="470" y="318" width="50" height="58" rx="8" fill="#e2e8f0"/>
  <path d="M520 330 q24 4 0 34" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <rect x="474" y="324" width="42" height="10" rx="4" fill="#78350f"/>
  <path d="M484 306 q-8 -14 2 -26" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M500 306 q-8 -14 2 -26" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- parcel box -->
  <g transform="translate(580 278)">
    <polygon points="0,30 70,0 140,30 70,60" fill="#d6a46b"/>
    <polygon points="0,30 70,60 70,110 0,80" fill="#b07d45"/>
    <polygon points="70,60 140,30 140,80 70,110" fill="#c48d52"/>
    <polygon points="30,17 100,47 110,43 40,13" fill="#e8c497"/>
    <text x="98" y="86" font-family="monospace" font-size="20" font-weight="bold" fill="#5b3a17">?</text>
  </g>
</svg>
