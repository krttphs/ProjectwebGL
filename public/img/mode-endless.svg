<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f1f"/>
      <stop offset="1" stop-color="#0e0a14"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="therm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <g id="unit">
      <rect width="150" height="34" rx="3" fill="#0b1120" stroke="#374151" stroke-width="2"/>
      <rect x="10" y="12" width="70" height="10" rx="2" fill="#1f2937"/>
      <circle cx="100" cy="17" r="4" fill="#22c55e"/>
      <circle cx="114" cy="17" r="4" fill="#f97316"/>
      <circle cx="128" cy="17" r="4" fill="#ef4444"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#room)"/>
  <!-- floor -->
  <polygon points="0,420 800,420 800,500 0,500" fill="#0a0710"/>
  <g stroke="#2a1d33" stroke-width="2">
    <line x1="0" y1="450" x2="800" y2="450"/><line x1="200" y1="420" x2="120" y2="500"/>
    <line x1="400" y1="420" x2="400" y2="500"/><line x1="600" y1="420" x2="680" y2="500"/>
  </g>

  <ellipse cx="400" cy="330" rx="420" ry="230" fill="url(#heat)"/>

  <!-- racks -->
  <g transform="translate(60 70)">
    <rect width="180" height="350" rx="8" fill="url(#rack)" stroke="#374151" stroke-width="4"/>
    <use href="#unit" x="15" y="20"/><use href="#unit" x="15" y="64"/><use href="#unit" x="15" y="108"/>
    <use href="#unit" x="15" y="152"/><use href="#unit" x="15" y="196"/><use href="#unit" x="15" y="240"/>
    <use href="#unit" x="15" y="284"/>
  </g>
  <g transform="translate(310 40)">
    <rect width="180" height="380" rx="8" fill="url(#rack)" stroke="#374151" stroke-width="4"/>
    <use href="#unit" x="15" y="20"/><use href="#unit" x="15" y="64"/><use href="#unit" x="15" y="108"/>
    <use href="#unit" x="15" y="152"/><use href="#unit" x="15" y="196"/><use href="#unit" x="15" y="240"/>
    <use href="#unit" x="15" y="284"/><use href="#unit" x="15" y="328"/>
  </g>
  <g transform="translate(560 70)">
    <rect width="180" height="350" rx="8" fill="url(#rack)" stroke="#374151" stroke-width="4"/>
    <use href="#unit" x="15" y="20"/><use href="#unit" x="15" y="64"/><use href="#unit" x="15" y="108"/>
    <use href="#unit" x="15" y="152"/><use href="#unit" x="15" y="196"/><use href="#unit" x="15" y="240"/>
    <use href="#unit" x="15" y="284"/>
  </g>

  <!-- heat waves / smoke -->
  <g fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M370 30 q14 -14 0 -28"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/></path>
    <path d="M400 34 q14 -16 0 -32"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/></path>
    <path d="M430 30 q14 -14 0 -28"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- thermometer -->
  <g transform="translate(760 120)">
    <rect x="-12" y="0" width="24" height="210" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="3"/>
    <rect x="-6" y="20" width="12" height="180" rx="6" fill="url(#therm)"/>
    <circle cx="0" cy="220" r="22" fill="#dc2626" stroke="#4b5563" stroke-width="3"/>
  </g>

  <!-- infinity -->
  <path d="M330 436 c0 -34 50 -34 70 0 c20 34 70 34 70 0 c0 -34 -50 -34 -70 0 c-20 34 -70 34 -70 0 z"
        fill="none" stroke="#fdba74" stroke-width="9" stroke-linejoin="round" opacity="0.95"/>
</svg>
