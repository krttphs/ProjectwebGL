<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Unity Web Player | my first game</title>
  <link rel="shortcut icon" href="/TemplateData/favicon.ico" />
  <link rel="stylesheet" href="/TemplateData/style.css" />
  <link rel="icon" type="image/png" href="/img/webIcon.png" />
  <style>
    :root {
      --bg: #0f1720;
      --right-bg: rgba(20, 20, 35, 0.85);
      --gutter-bg: #1e1e2e;
      --gutter-color: #9aa0a6;
      --text: #d7d7d7;
      --accent: #3c7bd9;
      --editor-font: "Fira Code", "Consolas", monospace;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #000;
    }

    /* --- Game Fullscreen Container --- */
    .game-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #unity-container {
      width: 100% !important;
      height: 100% !important;
    }

    #lineNumbers {
      white-space: pre;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* --- Floating Editor Panel --- */
    .editor-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      bottom: 20px;
      width: 420px;
      background: var(--right-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      color: var(--text);
    }

    .editor-panel.hidden {
      transform: translateX(450px);
      opacity: 0;
      pointer-events: none;
    }

    /* --- Toggle Button --- */
    #toggle-editor-btn {
      position: fixed;
      top: 25px;
      right: 25px;
      z-index: 101;
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(60, 123, 217, 0.4);
    }

    /* --- Inner Elements Styling --- */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .col-row {
      display: flex;
      gap: 10px;
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 12px;
      color: var(--accent);
      font-weight: bold;
      text-transform: uppercase;
    }

    select,
    textarea,
    #output {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px;
      border-radius: 6px;
    }

    .input-problem {
      height: 80px;
      resize: none;
      font-size: 13px;
    }

    .editor-wrap {
      flex: 1;
      display: flex;
      background: var(--gutter-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .gutter {
      background: #111;
      color: #555;
      padding: 10px 5px;
      text-align: right;
      min-width: 30px;
      font-family: var(--editor-font);
      font-size: 13px;
    }

    .editor {
      flex: 1;
    }

    #code {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #50fa7b;
      font-family: var(--editor-font);
      font-size: 13px;
      padding: 10px;
      outline: none;
      resize: none;
    }

    #output {
      height: 100px;
      overflow-y: auto;
      margin-top: 10px;
      font-family: var(--editor-font);
      font-size: 12px;
      white-space: pre-wrap;
      color: #8be9fd;
    }

    button {
      cursor: pointer;
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      background: #44475a;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.2);
    }

    #runBtn {
      background: #50fa7b;
      color: #282a36;
      font-weight: bold;
    }

    #submitBtn {
      background: #ff79c6;
      color: white;
      font-weight: bold;
    }

    /* Unity Loading Elements (สำคัญมากเพื่อให้ JS ไม่ Error) */
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 2;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: 0.3s;
    }
    .waitforUnityLoad{
      animation: waitforUnityLoad-animate 10s ease-in-out forwards
    }
    @keyframes waitforUnityLoad-animate{
      from{
        opacity: 0;
      }
      to{
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- Game -->
  <button id="toggle-editor-btn" style="display: none;" onclick="toggleEditor()">Open Editor</button>

  <div class="game-layer">
    <div id="score-board" style="display: flex; position: absolute; z-index: 99; width: 100%; justify-content: center; margin-top: 20px; opacity: 0; pointer-events: none;">
      <text style="font-size: large;">Score</text>
      <p id="score-number">0 | 0</p>
    </div>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-fullscreen-button" style="display: none;"></div>
      <div id="unity-warning" style="position: absolute; top:0; left:0;"></div>
    </div>
  </div>

  <div class="editor-panel hidden" id="editor-panel">
    <div class="controls">
      <div class="col-row">
        <div class="col">
          <label>Language</label>
          <select id="lang">
            <option value="62">Java</option>
            <option value="63">JavaScript</option>
            <option value="71">Python</option>
          </select>
        </div>
        <div class="col">
          <label>Difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="mid">Medium</option>
          </select>
        </div>
      </div>

      <div class="col">
        <label>Quest Description</label>
        <textarea id="problem" class="input-problem" readonly>กรุณาสุ่มโจทย์เพื่อเริ่มเล่น...</textarea>
      </div>

      <div style="display: flex; gap: 8px;">
        <button id="randomQuestBtn" style="flex: 2; background: var(--accent);">Random Quest</button>
        <button onclick="back()" style="flex: 1;">Give up</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
      <label>Code Editor</label>
      <div style="display: flex; gap: 5px;">
        <button id="runBtn">Run</button>
        <button id="submitBtn">Submit</button>
      </div>
    </div>

    <div class="editor-wrap">
      <div class="gutter" id="gutter">
        <div id="lineNumbers">1</div>
      </div>
      <div class="editor">
        <textarea id="code" spellcheck="false">import java.util.Scanner;
class Main {
    public static void main(String[] args) {
      //พิมพ์โค้ดที่นี่...
    }
}</textarea>
      </div>
    </div>

    <div id="output">Output logs will appear here...</div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var unityInstance = null; // เก็บ instance ไว้ใช้ภายนอก

    // --- Unity Loader Logic ---
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My Game",
      productVersion: "2.0.1",
    };
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((instance) => {
        unityInstance = instance;
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.getElementById("score-board").classList.add("waitforUnityLoad")
        if (instance.Module) {
          instance.Module.captureAllKeyboardInput = false;
        }
      }).catch((message) => { alert(message); });
    };
    document.body.appendChild(script);
    // --- UI Functions ---
    function toggleEditor() {
      setEditorOpen(!editorOpen);
    }

    window.addEventListener('resize', () => {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    });

    // ------- จัดการ input ใน editor -------
    (function () {
      const code = document.getElementById("code");
      const lineNumbers = document.getElementById("lineNumbers");
      const gutter = document.getElementById("gutter");

      function updateLineNumbers() {
        const lines = code.value.split("\n").length;
        let nums = "";
        for (let i = 1; i <= lines; i++) nums += i + "\n";
        lineNumbers.textContent = nums;
      }

      code.addEventListener("scroll", () => {
        gutter.scrollTop = code.scrollTop;
      });
      code.addEventListener("input", updateLineNumbers);
      code.addEventListener("keydown", function (e) {
        if (e.key === "Tab") {
          e.preventDefault();
          let s = this.selectionStart;
          let ePos = this.selectionEnd;
          this.value =
            this.value.substring(0, s) + "\t" + this.value.substring(ePos);
          this.selectionStart = this.selectionEnd = s + 1;
          updateLineNumbers();
        }
      });

      updateLineNumbers();
    })();
    //ดึง roomId จาก URL (ที่ส่งมาจาก lobby)
    const urlParams = new URLSearchParams(window.location.search);
    const currentRoomId = urlParams.get('roomId');
    let myScore = 0;
    async function updateScore(newScore){
      myScore+= newScore
      const scoreNumber = document.getElementById("score-number");
      scoreNumber.textContent = myScore
      try{
        await fetch("/api/game/updatePlayerScore",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({roomId:currentRoomId,score:myScore})
        })
      } catch(err){
        console.error("error message: ",err)
      }
     
    }
    // -------- Judge0 --------
    const runBtn = document.getElementById("runBtn");
    const output = document.getElementById("output");
    let timeout = null;
    runBtn.addEventListener("click", async () => {
      if (!currentQuest) {
        output.textContent = "⚠️ กรุณาสุ่มโจทย์ก่อน";
        return;
      }
      clearInterval(timeout);
      let dots = 0;
      timeout = setInterval(() => {
        dots = (dots % 3) + 1;
        output.textContent = "⏳ กำลังรันโค้ด" + ".".repeat(dots);
      }, 500);

      const lang = document.getElementById("lang").value;
      const code = document.getElementById("code").value;

      try {
        let res = await fetch(
          "https://ce.judge0.com/submissions/?base64_encoded=false&wait=true",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_code: code,
              language_id: lang,
              stdin: currentQuest.inputRun,
            }),
          }
        );
        let result = await res.json();
        clearInterval(timeout);
        if (result.stdout) {
          output.textContent =
            result.stdout +
            "\nเวลาที่ใช้: " +
            result.time +
            " วินาที" +
            "\nmomory ที่ใช้: " +
            result.memory +
            "KB";
        } else if (result.stderr)
          output.textContent = "Error:\n" + result.stderr;
        else if (result.compile_output)
          output.textContent = "Compile Error:\n" + result.compile_output;
        else output.textContent = "⚠️ ไม่พบ output";
      } catch (err) {
        clearInterval(timeout);
        output.textContent = "เกิดข้อผิดพลาด: " + err.message;
      }
    });
    function normalize(str) {
      return str.replace(/\r\n/g, "\n").trim();
    }
    //ส่ง Submit เข้า Unity
    const submitBtn = document.getElementById("submitBtn");
    let submitTimeout = null;
    document
      .getElementById("submitBtn")
      .addEventListener("click", async () => {
        if (!currentQuest) {
          output.textContent = "⚠️ กรุณาสุ่มโจทย์ก่อน";
          return;
        }

        clearInterval(submitTimeout);
        let dots = 0;
        submitTimeout = setInterval(() => {
          dots = (dots % 3) + 1;
          output.textContent =
            "ส่งโค้ดเรียบร้อยแล้ว ! \r⏳ กำลังรันโค้ด" + ".".repeat(dots);
        }, 500);

        const lang = document.getElementById("lang").value;
        const code = document.getElementById("code").value;

        try {
          let res = await fetch(
            "https://ce.judge0.com/submissions/?base64_encoded=false&wait=true",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                source_code: code,
                language_id: lang,
                stdin: currentQuest.inputSubmit, //ใช้ inputSubmit จากโจทย์
              }),
            }
          );

          let result = await res.json();
          clearInterval(submitTimeout);

          if (result.stdout) {
            if (
              normalize(result.stdout) ===
              normalize(currentQuest.expectedOutput)
            ) {
              //เทียบกับ expectedOutput
              output.textContent =
                "ถูกต้อง!! ✅" +
                "\nเวลาที่ใช้: " +
                result.time +
                " วินาที" +
                "\nmemory ที่ใช้: " +
                result.memory +
                "KB" +
                "\nรางวัล: " + currentQuest.rewards+
                "\nได้คะแนน: 50";
                updateScore(50)
              addReward(currentQuest.rewards)
              // if (unityInstance) {
              //   unityInstance.SendMessage("player1", "TriggerAttack");
              // }
            } else {
              output.textContent =
                "❌ Output ไม่ตรงกับที่ต้องการ\n" +
                "ลบ 25 แต้ม"
                // "Expected:\n" +
                // currentQuest.show_expect_output +
                // "\n" +
                // "Got:\n" +
                // result.stdout;
                updateScore(-25)
            }
          } else if (result.stderr) {
            output.textContent = "Error:\n" + result.stderr;
          } else if (result.compile_output) {
            output.textContent = "Compile Error:\n" + result.compile_output;
          } else {
            output.textContent = "⚠️ ไม่พบ output";
          }
        } catch (err) {
          clearInterval(submitTimeout);
          output.textContent = "เกิดข้อผิดพลาด: " + err.message;
        }
      });

    let currentQuest = null; // เก็บโจทย์ที่สุ่มมา

    document
      .getElementById("randomQuestBtn")
      .addEventListener("click", async () => {
        try {
          // ดึงค่าความยากจาก Dropdown มาเก็บใส่ตัวแปรก่อน
          const difficultyLevel = document.getElementById("difficulty").value;

          let res = await fetch(`/api/quests/random/${difficultyLevel}`);

          if (!res.ok) {
            throw new Error(`Server error: ${res.status}`);
          }

          let quest = await res.json();
          currentQuest = quest;

          currentQuest.inputRun = quest.input_run;
          currentQuest.inputSubmit = quest.input_submit;
          currentQuest.expectedOutput = quest.expected_output;
          currentQuest.rewards = quest.rewards

          // แสดงผลใน UI
          document.getElementById("problem").value = quest.description;
          output.textContent = "สุ่มได้โจทย์: " + quest.title + "\n";
          output.textContent += "Input ที่ใช้: " + quest.input_run + "\n";
          output.textContent +=
            "ผลลัพธ์ที่ต้องการ:\n" + quest.show_expect_output;
        } catch (err) {
          console.error(err);
          output.textContent = "สุ่มโจทย์ไม่สำเร็จ: " + err.message;
        }
      });
    // ฟังก์ชันสำหรับเรียก API บวกเงิน
    async function addReward(amount) {
      try {
        const res = await fetch("/api/user/add-coins", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: amount }),
        });

        if (!res.ok) {
          const err = await res.json();
          console.error("เติมเงินไม่เข้า:", err);
          return;
        }

        const data = await res.json();
        console.log("ได้รับเงินรางวัล! ยอดคงเหลือ:", data.newBalance);

        // ถ้ามี Unity ให้ส่งค่าไปอัปเดต UI ในเกม
        // if (unityInstance) {
        //   unityInstance.SendMessage("player1", "TriggerAttack");
        // }
      } catch (err) {
        console.error("Server Error:", err);
      }
    }
    function back() {
      window.location.href = "/";
    }
    // ประกาศฟังก์ชันให้ Global (window) เพื่อให้ Unity หาเจอ
    // --- Editor Open/Close State ---
    let editorOpen = false;

    function setEditorOpen(open) {
      editorOpen = open;
      const panel = document.getElementById('editor-panel');
      const btn = document.getElementById('toggle-editor-btn');
      const codeTextarea = document.getElementById('code');
      const unityCanvas = document.getElementById('unity-canvas');

      if (open) {
        panel.classList.remove('hidden');
        btn.textContent = 'Close Editor';

        // ปลด Pointer Lock ก่อนทุกอย่าง
        if (document.pointerLockElement) {
          document.exitPointerLock();
        }

        // ตัด Unity canvas ออกจากการรับ focus และ pointer
        // นี่คือสาเหตุหลักที่ Unity steal focus กลับ — canvas มี tabIndex และ pointerEvents อยู่
        if (unityCanvas) {
          unityCanvas.tabIndex = -1;
          unityCanvas.style.pointerEvents = 'none';
          unityCanvas.blur();
        }

        // ปิด Unity keyboard capture
        if (unityInstance && unityInstance.Module) {
          unityInstance.Module.captureAllKeyboardInput = false;
        }

        // รอ 1 frame หลัง pointerLock release แล้ว focus textarea
        setTimeout(() => {
          codeTextarea.focus();
        }, 50);

      } else {
        panel.classList.add('hidden');
        btn.textContent = 'Open Editor';

        // คืน canvas ให้ Unity ทำงานตามปกติ
        if (unityCanvas) {
          unityCanvas.tabIndex = 0;
          unityCanvas.style.pointerEvents = 'auto';
        }

        // คืน keyboard ให้ Unity
        if (unityInstance && unityInstance.Module) {
          unityInstance.Module.captureAllKeyboardInput = true;
        }

        if (unityCanvas) unityCanvas.focus();
      }
    }

    window.ShowCodeEditor = function (objectId) {
      console.log("Unity บอกให้เปิด Editor ที่เครื่อง: " + objectId);
      setEditorOpen(!editorOpen);
    };

    window.ShowEditorButton = function (objectId) {
      const btn = document.getElementById('toggle-editor-btn');
      btn.innerText = "Open Editor"
      btn.style.display = "flex";
    }
    window.HideEditorButton = function (objectId) {
      const btn = document.getElementById('toggle-editor-btn');
      btn.style.display = "none";
      setEditorOpen(false);
    }

    const codeInput = document.getElementById("code");
    const problemInput = document.getElementById("problem");
    const langSelect = document.getElementById("lang");
    const difficultySelect = document.getElementById("difficulty");

    const editableElements = [codeInput, problemInput, langSelect, difficultySelect];

    editableElements.forEach(el => {
      if (!el) return;
      el.addEventListener("mousedown", () => {
        if (document.pointerLockElement) {
          document.exitPointerLock();
        }
        if (unityInstance && unityInstance.Module) {
          unityInstance.Module.captureAllKeyboardInput = false;
        }
      });
    });

    // Unity bind keyboard listeners ที่ window ด้วย capture:true
    // วิธีเดียวที่ตัดได้คือดักที่ window capture phase ก่อน Unity
    // แล้วเช็คว่า activeElement เป็น textarea -> stopImmediatePropagation ตัด Unity
    // แต่ไม่ preventDefault เพื่อให้ browser ยังแสดงตัวอักษรใน textarea ได้ปกติ
    ['keydown', 'keypress', 'keyup'].forEach(evtType => {
      window.addEventListener(evtType, (e) => {
        if (document.activeElement === codeInput) {
          e.stopImmediatePropagation();
          // ไม่ preventDefault — ให้ browser จัดการ input ตามปกติ
        }
      }, true); // capture:true — ทำงานก่อน Unity listener
    });
  </script>
</body>

</html>
