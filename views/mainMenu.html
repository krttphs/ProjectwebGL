<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERCODE GAME - MAIN MENU</title>
    <link rel="icon" type="image/png" href="/img/webIcon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/mainMenu.css">
</head>

<body style="font-family: 'Poppins', sans-serif;">

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <main class="wrapper">
        <section class="card">

            <div class="content">
                <div class="title-small">WELCOME TO</div>

                <h1>
                    OVERCODE<br>
                    <span>GAME</span>
                </h1>

                <div class="buttons">
                    <button class="btn play" onclick="goToLobby()">PLAY</button>

                    <button class="btn" onclick="goToProfile()">PROFILE</button>

                    <button class="btn" onclick="goToRanking()">RANKING</button>

                    <button class="btn" onclick="goToFriends()">FRIENDS</button>

                    <button class="btn" onclick="goToShop()">SHOP</button>

                    <button class="btn" onclick="goToQuest()">QUEST</button>

                    <button class="btn" onclick="goToSettings()">SETTINGS</button>
                </div>

                <button class="logout" onclick="logout()">LOGOUT</button>
            </div>

        </section>

        <footer>

        </footer>
    </main>

    <script src="/js/mainMenu.js"></script>

</body>

</html>
