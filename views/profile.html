<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabaseBrowser.js"></script>
    <title>OVERCODE GAME</title>

    <link rel="icon" type="image/png" href="/img/webIcon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/profile.css">
</head>

<body>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <main class="wrapper">

        <section class="card">

            <div class="content">

                <div class="title-small">PLAYER PROFILE</div>

                <div class="profile">

                    <!-- Profile Image -->
                    <div class="avatar">
                        <img id="profileImage" src="/img/default-avatar.png" alt="">
                    </div>

                    <input type="file" id="profileImageInput" accept="image/png,image/jpeg,image/webp" hidden>

                    <button type="button" class="change-profile"
                        onclick="document.getElementById('profileImageInput').click()">
                        CHANGE PROFILE
                    </button>

                    <!-- Username -->
                    <h2 id="username">
                        USERNAME
                    </h2>

                    <!-- Player ID -->
                    <div class="player-id">
                        PLAYER ID:
                        <span id="playerId">000000</span>
                    </div>

                    <!-- Bio -->
                    <div class="bio-section">

                        <textarea id="bio" placeholder="Write something about yourself..." maxlength="150"></textarea>

                        <div class="bio-bottom">

                            <span id="bioCount">
                                0 / 150
                            </span>

                            <button class="save-bio" onclick="saveBio()">
                                SAVE
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Level -->
                <div class="level-section">

                    <div class="level-row">

                        <span>
                            LEVEL <span id="level">1</span>
                        </span>

                        <span>
                            <span id="exp">0</span>
                            /
                            <span id="maxExp">100</span>
                            EXP
                        </span>

                    </div>

                    <div class="exp-bar">

                        <div id="expBar"></div>

                    </div>

                </div>

                <!-- Coins -->
                <div class="coin">
                    🪙 <span id="coins">0</span> Coins
                </div>

                <!-- Back -->
                <button class="back-button" onclick="goToMainMenu()">

                    BACK TO MAIN MENU

                </button>

            </div>

        </section>

    </main>

    <script src="/js/profile.js"></script>

</body>

</html>
